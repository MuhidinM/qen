name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Package correctness (publint, Are the Types Wrong)
        run: pnpm --filter @qen/core check:package
      - name: Umm al-Qura table matches ICU
        run: pnpm --filter @qen/core check:umalqura
      - name: Public API matches the committed report (api-extractor)
        run: pnpm --filter @qen/core check:api
      - name: Every export documented, with an example (TypeDoc)
        run: pnpm --filter @qen/core check:docs
      - name: README examples run and are correct
        run: pnpm --filter @qen/core check:readme
      - name: Bundle size budget
        run: pnpm --filter @qen/core size
      - name: '@qen/react package correctness, size and stories'
        run: |
          pnpm --filter @qen/react check:package
          pnpm --filter @qen/react size
          pnpm --filter @qen/react build:stories

  test:
    name: test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Africa/Addis_Ababa]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runtime facts (ICU version, time zone)
        run: |
          node -p "'ICU ' + process.versions.icu + ' · TZ ' + Intl.DateTimeFormat().resolvedOptions().timeZone + ' · ethiopic calendar = ' + new Intl.DateTimeFormat('en-u-ca-ethiopic').resolvedOptions().calendar"
      - run: pnpm test

  node:
    name: smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @qen/core smoke

  deno-bun:
    name: smoke (Deno, Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cd packages/core && sh smoke/run.sh deno bun

  browsers:
    name: smoke (Chromium, Firefox, WebKit + service worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qen/core build
      # The runner's apt mirror sometimes crawls (~30 KB/s) and the install never finishes; it
      # normally takes about a minute. Cap the attempt and retry once.
      - id: browsers-install
        timeout-minutes: 6
        continue-on-error: true
        run: pnpm --filter @qen/core exec playwright install --with-deps chromium firefox webkit
      - if: steps.browsers-install.outcome == 'failure'
        name: Retry browser install
        timeout-minutes: 8
        run: |
          # The timed-out attempt's sudo apt-get survives the step timeout and holds the dpkg
          # lock (seen on #150), so stop it, wait for the lock, and let apt wait for locks too.
          sudo pkill -f 'apt-get|dpkg' || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 2; done
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          sudo dpkg --configure -a
          pnpm --filter @qen/core exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @qen/core smoke:browser

  web:
    name: website (e2e, axe, headers, Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@qen/web
      # Playwright and Lighthouse use the runner's preinstalled Google Chrome (no apt download).
      - run: google-chrome --version
      - name: End-to-end, accessibility and security header tests
        run: pnpm --filter @qen/web test:e2e
      - name: Lighthouse budget (at least 90 in every category, every route)
        run: pnpm --filter @qen/web lighthouse
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-reports
          path: |
            apps/web/test-results
            apps/web/.lighthouseci

  # Single required check for branch protection: passes only if every job passed.
  ci:
    if: always()
    needs: [checks, test, node, deno-bun, browsers, web]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
