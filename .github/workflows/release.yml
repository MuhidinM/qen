name: Release

# Publishes to npm when main has no pending changesets and a package version isn't on npm yet
# (ADR-0011). Version bumps arrive through a normal "Version packages" PR, opened from a
# branch so CI runs on it; merging that PR is the owner's approval to publish.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # tags and GitHub releases
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pending changesets?
        id: pending
        run: |
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo "$count pending changeset(s): waiting for a Version packages PR."; fi
      - if: steps.pending.outputs.count == '0'
        uses: pnpm/action-setup@v6
      - if: steps.pending.outputs.count == '0'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.pending.outputs.count == '0'
        run: pnpm install --frozen-lockfile
      - if: steps.pending.outputs.count == '0'
        name: Publish new versions
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
