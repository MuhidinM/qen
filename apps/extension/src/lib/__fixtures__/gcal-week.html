<!doctype html>
<!-- Hand-written from the structure of Google Calendar's week view (saved 2026-10-25): only the
     elements and attributes the overlay depends on (src/lib/gcal.ts). No Google markup or events. -->

    <title>Google Calendar - Week of October 25, 2026</title>
  </head>

    <div role="grid" aria-label="Week of October 25, 2026">
      <div role="row">
        <div role="columnheader">
          <h2 aria-label="Sunday, October 25">
            <div aria-hidden="true">Sun</div>
            <button type="button" data-datekey="29017">25</button>
          </h2>
        </div>
        <div role="columnheader">
          <h2 aria-label="Monday, October 26">
            <div aria-hidden="true">Mon</div>

        </div>
        <div role="columnheader">

            <div aria-hidden="true">Wed</div>
            <button type="button" data-datekey="29020">28</button>

        </div>
        <div role="columnheader">
          <h2 aria-label="Thursday, October 29">
            <div aria-hidden="true">Thu</div>
            <button type="button" data-datekey="29021">29</button>
          </h2>
        </div>
        <div role="columnheader">
          <h2 aria-label="Friday, October 30">

          </h2>
        </div>
        <div role="columnheader">
          <h2 aria-label="Saturday, October 31">
            <div aria-hidden="true">Sat</div>
            <button type="button" data-datekey="29023">31</button>
          </h2>
        </div>
      </div>
      <div role="row">
        <ul aria-hidden="true">
          <li data-datekey="29017"></li>
          <li data-datekey="29018"></li>
          <li data-datekey="29019"></li>
          <li data-datekey="29020"></li>
          <li data-datekey="29021"></li>
          <li data-datekey="29022"></li>
          <li data-datekey="29023"></li>

        <div role="gridcell" data-datekey="29017"><h2>No events</h2></div>

        <div role="gridcell" data-datekey="29019"><h2>No events</h2></div>

        <div role="gridcell" data-datekey="29021"><h2>No events</h2></div>
        <div role="gridcell" data-datekey="29022"><h2>No events</h2></div>
        <div role="gridcell" data-datekey="29023"><h2>No events</h2></div>

    </div>

</html>
