<!doctype html>
<!-- Hand-written from the structure of Google Calendar's day view (saved 2026-10-25): only the
     elements and attributes the overlay depends on (src/lib/gcal.ts). No Google markup or events.
     The day view's header has no data-datekey; the all-day row's list item has it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Calendar - Sunday, October 25, 2026, today</title>
  </head>
  <body>
    <div role="grid" aria-label="Sunday, October 25, 2026">
      <div role="row">
        <div role="columnheader">
          <h2 aria-label="Sunday, October 25, today">
            <div aria-hidden="true">Sun</div>
            <div tabindex="0">25</div>
          </h2>
        </div>
      </div>
      <div role="row">
        <ul aria-hidden="true">
          <li data-datekey="29017"></li>
        </ul>
        <div role="gridcell" data-datekey="29017"><h2>No events</h2></div>
      </div>
    </div>
  </body>
</html>
